<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Oyster Atlas</title>
<meta name="description" content="The world's oysters mapped by market name — 520 and counting, mostly North America. By Fogday Studios.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="The Oyster Atlas: Oyster Lovers United!">
<meta property="og:description" content="Welcome to the Oyster Atlas! We map the world's oysters">
<meta property="og:determiner" content="the">
<meta property="og:locale" content="en_US">
<meta name="theme-color" content="#021724">

<!-- Mapbox GL JS (revised 17 October 2026) -->
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.css">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.js" defer></script>

<!-- Search by market name (bottom right, just above the zoom buttons) -->
<link rel="stylesheet" href="assets/css/oyster-search.css">
<script src="assets/js/oyster-search.js" defer></script>

<!-- Source Sans 3 (the current version of the site's original Source Sans Pro) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">

<style>
  /* The Oyster Atlas — one self-contained page. Always dark: the glowing oyster names only read on a dark map. */
  :root {
    --bg: #021724;        /* deep navy, the original page color */
    --panel: #0b2233;
    --ink: #e3eaee;
    --muted: #8fa3b1;
    --line: #23394a;
    --accent: #b2b200;    /* the original chartreuse */
    --font: "Source Sans 3", "Source Sans Pro", Seravek, Calibri, "Segoe UI", Ubuntu, Arial, sans-serif;
    color-scheme: dark;
    /* iPhone safe areas (Dynamic Island, home indicator, landscape edges). Zero on screens without them. */
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --kb: 0px;  /* height of the on-screen keyboard while the search box is in use (set by the script) */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 400 1rem/1.4 var(--font); }
  body { overflow: hidden; }
  #map { position: fixed; inset: 0; }

  /* Panels floating over the map */
  .map-places button, .map-legend-panel, .map-menu-panel, .oa-detail-panel, .title {
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--ink); border: 1px solid var(--line);
  }

  /* Title, top left: tap it to return to the overview */
  .top { position: fixed; z-index: 3;  /* pinned to the screen, so it never moves if the page itself scrolls (iPhone Safari) */
         top: calc(12px + var(--sat)); left: var(--sal); right: var(--sar); pointer-events: none; }
  .title {
    pointer-events: auto; display: inline-block; margin: 0 0 20px 12px; padding: 8px 14px;  /* 20px down to the Regions menu / pills */ border-radius: 8px; cursor: pointer;
    border: 0;  /* no outline box: the frosted backdrop alone sets it off the map */
    font: 700 1.12rem/1 var(--font);  /* ~17.9px: 2pt (2.67px) up from .95rem */
    letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
  }
  /* The words take Fogday's "Selected Works" blue: the same left-to-right sky gradient
     (fogday.com --title-1 → --title-2). It sits on an inner span so the button keeps its frosted backdrop.
     Contrast on the navy: 4.3:1 and 5.3:1. Hover keeps the chartreuse accent. */
  .title-text {
    background-image: linear-gradient(to right, #2f7fc1, #4a90c8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .title:hover .title-text { background-image: none; color: var(--accent); }
  .title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Region pills: one row. If they don't fit, the row scrolls sideways (swipe, trackpad or mouse wheel)
     and the edge with more regions fades out as a hint. */
  .map-places-wrap {
    --fl: 0px; --fr: 0px;  /* fade widths, set by the script below */
    pointer-events: auto; width: fit-content; max-width: 100%;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
            mask-image: linear-gradient(to right, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
  }
  .map-places {
    display: flex; gap: 8px; padding: 0 12px; scroll-padding-inline: 12px;
    overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity; scrollbar-width: none; overscroll-behavior-x: contain;
    touch-action: pan-x;  /* a finger swipe on the row scrolls the regions, not the map */
  }
  .map-places::-webkit-scrollbar { display: none; }
  .map-places button {
    flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer;
    font: 600 .95rem/1.2 var(--font); white-space: nowrap; scroll-snap-align: start;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    transition: background-color .15s ease, color .15s ease;
  }
  .map-places button:hover { color: var(--accent); }
  .map-places button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  /* Selected region: solid white, bold */
  .map-places button[aria-pressed="true"] { background: #edf1f2; color: #1c2830; border-color: #edf1f2; font-weight: 700; }
  .map-places button[aria-pressed="true"]:hover { color: #1c2830; }
  /* Reserve each pill's bold width up front, so selecting one doesn't nudge its neighbors */
  .map-places button::after { content: attr(data-name); font-weight: 700; height: 0; overflow: hidden; visibility: hidden; }
  @media (min-width: 760px) {
    .top { top: calc(16px + var(--sat)); }
    .title { margin-left: 16px; }
    .map-places { padding: 0 16px; scroll-padding-inline: 16px; }
    .map-places button { min-height: 36px; }
  }

  /* Bottom left, above the Mapbox logo: the picked oyster's details, then the legend under it. */
  .map-bottom-left {
    position: fixed; z-index: 2; left: calc(12px + var(--sal)); bottom: calc(50px + var(--sab));  /* clears the credit line */
    display: flex; flex-direction: column; gap: 8px;
    width: 320px; max-width: calc(100% - 24px - var(--sal) - var(--sar)); max-height: calc(100% - 180px - var(--sat) - var(--sab));
  }
  /* Legend: starts collapsed; opens only when tapped. */
  .map-legend-panel { min-height: 0; overflow-y: auto; border-radius: 8px; }
  /* Picked oyster: its own card, shown only once one is chosen (from search or a tap on the map) */
  /* No border, and only as wide as its text (up to the column's 320px, then it wraps) */
  .oa-detail-panel { flex: none; align-self: flex-start; max-width: 100%; box-sizing: border-box;
                     padding: 10px 14px; border-radius: 8px; border: 0; }
  .oa-detail-panel[hidden] { display: none; }
  /* Legend card: border at 50% opacity, darker than the other panels */
  .map-legend-panel { border-color: color-mix(in srgb, var(--line) 50%, transparent); }
  /* Oyster species: just its title while shut (no border or background); the panel appears once it opens.
     It stays during the closing slide and fades out after, so the list never shows without its panel. */
  .map-legend-panel { transition: background-color .18s ease, border-color .18s ease; }
  .map-legend-panel:has(.map-legend:not([open])) {
    background: transparent; border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  .oa-detail-panel .oa-detail { margin: 0; }
  /* The legend and the phone's Regions menu (.map-menu) share one look: an uppercase title with + / –, and a plain list */
  .map-legend summary, .map-menu summary {
    list-style: none; cursor: pointer; padding: 10px 14px; min-height: 40px;
    font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
  }
  .map-legend summary::-webkit-details-marker, .map-menu summary::-webkit-details-marker { display: none; }
  .map-legend summary::after, .map-menu summary::after { content: " +"; color: var(--muted); }
  .map-legend[open] summary::after, .map-menu[open] summary::after { content: " –"; }
  .map-legend summary:focus-visible, .map-menu summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
  .map-legend ul, .map-menu ul { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 6px; font-size: .9rem; }
  .map-legend li { display: flex; align-items: center; gap: 8px; }  /* color dot far left, name, Latin name far right */
  .map-legend li i { color: var(--muted); margin-left: auto; padding-left: 12px; white-space: nowrap; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--c); }

  /* Phones: the pill row gives way to a Regions menu under the title, in the legend's style.
     Its rows are made from the pills (script below), so the pills stay the one place to edit regions. */
  .map-menu-panel { display: none; pointer-events: auto; width: fit-content; max-width: calc(100% - 24px);
                    margin-left: 12px; border-radius: 8px; border: 0;  /* no outline: just the frosted panel */
                    max-height: calc(100vh - 200px - var(--sat) - var(--sab)); overflow-y: auto; }
  /* Regions menu: compact when shut (5px around its title, hugging it), roomier once opened
     (the legend's 10–14px, at least 200px wide). Eases between the two with the 180ms slide. */
  .map-menu { min-width: 0; transition: min-width .18s ease; }
  .map-menu[open] { min-width: 200px; }
  .map-menu summary { padding: 5px; transition: padding .18s ease; }
  .map-menu[open] summary { padding: 10px 14px; }
  .map-menu ul { padding: 0 14px 12px; }
  /* Title dead center, both ways: an invisible "+" on the left balances the real one on the right,
     and the text box is trimmed to the capitals so they sit exactly mid-height (older browsers: within ~1px) */
  .map-menu summary { display: flex; justify-content: center; align-items: center; }
  .map-menu summary::after, .map-menu[open] summary::after { content: none; }
  .map-menu summary span { display: inline-block; text-box: trim-both cap alphabetic; }
  .map-menu summary span::before { content: "+\00a0"; visibility: hidden; }
  .map-menu summary span::after { content: "\00a0+"; color: var(--muted); }
  .map-menu[open] summary span::before { content: "–\00a0"; }
  .map-menu[open] summary span::after { content: "\00a0–"; }
  .map-menu li button {
    all: unset; box-sizing: border-box; display: flex; align-items: center; width: 100%; min-height: 28px; cursor: pointer; color: var(--ink);
  }
  .map-menu li button:hover { color: var(--accent); }
  .map-menu li button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .map-menu li button[aria-current="true"] { font-weight: 700; }   /* the region on screen, bold like a selected pill */
  @media (max-width: 759px) {
    .map-places-wrap { display: none; }
    /* Title centered across the top. (The Regions menu moved to the folded-map button between the search glass and zoom.) */
    .top { text-align: center; }
    .title { margin-left: 0; }
    .map-menu summary { justify-content: center; }
    .map-menu li button { justify-content: center; }
  }

  /* Search: its own card at bottom right, at the top of the stack (above the folded-map button on phones, above zoom on desktop).
     It is added as a Mapbox control, so it always stays in that stack. Hidden until the map places it. */
  .oa-search[hidden] { display: none; }
  .mapboxgl-ctrl.oa-search {
    width: 300px; max-width: calc(100vw - 20px); padding: 8px; border-radius: 8px;
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--ink); border: 1px solid var(--line); font: 400 1rem/1.4 var(--font);
  }
  .mapboxgl-ctrl.oa-search .oa-field { margin-left: auto; }
  .mapboxgl-ctrl.oa-search .oa-field:not(:focus-within) { border-color: color-mix(in srgb, var(--line) 50%, transparent); }  /* 50% like the legend; focus keeps its highlight */              /* bar hugs the right edge, over the zoom buttons */
  .mapboxgl-ctrl.oa-search.oa-collapsed { width: auto; max-width: min(300px, calc(100vw - 20px)); }
  /* Minimized: just the magnifying-glass button, no card around it */
  .mapboxgl-ctrl.oa-search.oa-collapsed { padding: 0; border: 0; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  /* Minimized glass: same size, corners and edges as the zoom buttons below it, so the two line up */
  .mapboxgl-ctrl.oa-search.oa-collapsed .oa-field { width: 32px; height: 32px; border-radius: 4px; gap: 0; }  /* no gap for the hidden text box, so the glass is truly centered */

  /* Mapbox's corners (logo, credits, search, zoom) stay clear of the home indicator and the landscape notch.
     The bottom-right stack also rises above the keyboard while you type a search. */
  .mapboxgl-ctrl-bottom-left  { left: var(--sal); bottom: var(--sab); }
  .mapboxgl-ctrl-bottom-right { right: var(--sar); bottom: calc(var(--sab) + var(--kb)); }

  /* Zoom + compass: same look as the search glass above them (dark panel, 50% border, muted icons, same width).
     The 1px border sits outside the buttons, so buttons are 2px narrower than the glass to keep the same outer width. */
  .mapboxgl-map .mapboxgl-ctrl-group { background: var(--panel); border: 1px solid color-mix(in srgb, var(--line) 50%, transparent); box-shadow: none; }
  .mapboxgl-map .mapboxgl-ctrl-group button { width: 30px; }
  .mapboxgl-map .mapboxgl-ctrl-group button + button { border-top: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
  .mapboxgl-map .mapboxgl-ctrl-group button:not(:disabled):hover { background-color: color-mix(in srgb, var(--ink) 8%, transparent); }
  .mapboxgl-map .mapboxgl-ctrl-group .mapboxgl-ctrl-icon { filter: url(#oa-ctrl-tint); }  /* Mapbox's icons → the glass's muted color (filter below the map div) */

  /* Phones: a folded-map button between the search glass and zoom, in the glass's format. Tapping it opens the
     Regions menu to its left (rows made from the pills, script below). Desktop keeps the pill row. */
  .oa-regions[hidden] { display: none; }
  .mapboxgl-ctrl.oa-regions { position: relative; }
  .oa-pin {
    display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 32px; height: 32px; padding: 0;
    background: var(--panel); border: 1px solid color-mix(in srgb, var(--line) 50%, transparent); border-radius: 4px;
    color: var(--muted); cursor: pointer;
  }
  /* Beat Mapbox's own light hover on control buttons; on phones a tap leaves no hover tint behind */
  .mapboxgl-ctrl button.oa-pin:not(:disabled):hover { background-color: var(--panel); }
  @media (hover: hover) { .mapboxgl-ctrl button.oa-pin:not(:disabled):hover { background-color: color-mix(in srgb, var(--ink) 8%, var(--panel)); } }
  .oa-pin[aria-expanded="true"] { color: var(--accent); }
  .oa-pin:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .oa-regions-pop {
    position: absolute; right: calc(100% + 8px); bottom: 0; min-width: 200px; padding: 0 0 12px; border-radius: 8px;
    max-height: calc(100vh - 160px - var(--sat) - var(--sab)); overflow-y: auto; overscroll-behavior: contain;
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--ink); font: 400 1rem/1.4 var(--font); text-align: left;
  }
  .oa-regions-pop[hidden] { display: none; }
  .oa-regions-title { margin: 0; padding: 10px 14px; font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
  .oa-regions-pop ul { list-style: none; margin: 0; padding: 0 14px; display: grid; gap: 6px; font-size: .9rem; }
  .oa-regions-pop li button {
    all: unset; box-sizing: border-box; display: flex; align-items: center; width: 100%; min-height: 28px; cursor: pointer; color: var(--ink); white-space: nowrap;
  }
  .oa-regions-pop li button:hover { color: var(--accent); }
  .oa-regions-pop li button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .oa-regions-pop li button[aria-current="true"] { font-weight: 700; }   /* the region on screen */
  @media (min-width: 760px) { .mapboxgl-ctrl.oa-regions { display: none; } }

  /* Touch screens (iPhone): 44-point tap targets, Apple's minimum */
  @media (pointer: coarse) {
    .oa-pin { width: 44px; height: 44px; }   /* same as the glass and zoom */
    .oa-regions-pop ul { gap: 0; }
    .oa-regions-pop li button { min-height: 44px; }
    .map-places button { min-height: 44px; }
    .map-legend summary, .map-menu summary { min-height: 44px; display: flex; align-items: center; gap: .3em; }  /* gap keeps the space before + / – */
    .map-menu li button { min-height: 44px; }
    .map-menu ul { gap: 0; }
    .mapboxgl-map .mapboxgl-ctrl-group button { width: 42px; height: 44px; }  /* + 2px border = 44, same as the glass */
    .mapboxgl-ctrl.oa-search .oa-field { height: 44px; }
    .mapboxgl-ctrl.oa-search.oa-collapsed .oa-field { width: 44px; height: 44px; }  /* glass stays the same width as zoom */
    .oa-input { font-size: 16px; }  /* under 16px, iPhone Safari zooms the whole page when the box is tapped */
    .oa-result { height: 44px; }
    .oa-results { max-height: calc(5 * 44px); }
  }
</style>
</head>
<body>

<div id="map" role="region" aria-label="Map of the world's oysters"></div>
<!-- Recolors Mapbox's zoom/compass icons: dark parts → --muted (#8fa3b1), the compass's light half → a dim shade of it -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="oa-ctrl-tint" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="-0.6017 0 0 0 0.6813  -0.6817 0 0 0 0.7753  -0.7400 0 0 0 0.8420  0 0 0 1 0"/>
  </filter>
</svg>

<div class="top">
  <h1 style="margin:0"><button type="button" class="title" data-home title="Back to the overview"><span class="title-text">The Oyster Atlas</span></button></h1>
  <div class="map-places-wrap">
    <nav class="map-places" aria-label="Fly to a region">
      <!-- name · center [longitude, latitude] · zoom · bearing (map rotation, degrees) · optional speed/curve (default 1 / 1) — same as the original site -->
      <button type="button" data-name="Washington • British Columbia" data-center="[-123.05, 49]"   data-zoom="6"  data-bearing="6" data-speed="1.2" data-curve="1.42">Washington • British Columbia</button>
      <button type="button" data-name="Tomales Bay"                   data-center="[-122.84, 38.10]" data-zoom="7"  data-bearing="0">Tomales Bay</button>
      <button type="button" data-name="Maritime Provinces"            data-center="[-63.8, 46.7]"    data-zoom="7"  data-bearing="5">Maritime Provinces</button>
      <button type="button" data-name="Damariscotta"                  data-shape="gulf-of-maine">Damariscotta</button>  <!-- fits the Gulf of Maine outline (SHAPES below) -->
      <button type="button" data-name="Cape Cod • Long Island"        data-center="[-72.2, 41.5]"    data-zoom="7"  data-bearing="0">Cape Cod • Long Island</button>
      <button type="button" data-name="Chesapeake Bay"                data-center="[-76.2, 37.5]"    data-zoom="7"  data-bearing="0">Chesapeake Bay</button>
      <button type="button" data-name="Gulf Coast"                    data-center="[-90, 29]"        data-zoom="6"  data-bearing="6">Gulf Coast</button>
      <button type="button" data-name="France"                        data-center="[-1.1, 45.80]"    data-zoom="11" data-bearing="0">France</button>
    </nav>
  </div>
  <div class="map-menu-panel">
    <details class="map-menu">
      <summary><span>Regions</span></summary>
      <ul aria-label="Fly to a region"></ul>  <!-- filled from the pills above -->
    </details>
  </div>
</div>

<div class="map-bottom-left">
<div id="oa-detail-panel" class="oa-detail-panel" hidden></div>  <!-- the picked oyster; filled by oyster-search.js -->
<div class="map-legend-panel">
<details class="map-legend">
  <summary>Oyster species</summary>
  <!-- One place to edit species: search reads names, Latin names and colors from these rows -->
  <ul>
    <li><span class="dot" style="--c:#7D12B3"></span><span class="sp-name">Belon</span><i>(Ostrea edulis)</i></li>
    <li><span class="dot" style="--c:#C72052"></span><span class="sp-name">Eastern</span><i>(Crassostrea virginica)</i></li>
    <li><span class="dot" style="--c:#C7A15B"></span><span class="sp-name">Kumamoto</span><i>(Crassostrea sikamea)</i></li>
    <li><span class="dot" style="--c:#4E79D6"></span><span class="sp-name">New Zealand Flat</span><i>(Ostrea chilensis)</i></li>
    <li><span class="dot" style="--c:#A2BC13"></span><span class="sp-name">Olympia</span><i>(Ostrea lurida)</i></li>
    <li><span class="dot" style="--c:#2A7889"></span><span class="sp-name">Pacific</span><i>(Crassostrea gigas)</i></li>
    <li><span class="dot" style="--c:#E8743B"></span><span class="sp-name">Sydney Rock</span><i>(Saccostrea glomerata)</i></li>
  </ul>
</details>
</div>
</div>

<!-- Regions button and search: moved into the map's bottom-right corner by the script below -->
<div class="oa-regions" hidden>  <!-- phones: folded-map button between the search glass and zoom; tap it for the Regions menu -->
  <button type="button" class="oa-pin" aria-expanded="false" aria-controls="oa-regions-pop" aria-label="Regions" title="Regions">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
  </button>
  <div class="oa-regions-pop" id="oa-regions-pop" hidden>
    <p class="oa-regions-title">Regions</p>
    <ul aria-label="Fly to a region"></ul>  <!-- filled from the pills -->
  </div>
</div>
<div class="oa-search oa-collapsed" role="search" hidden>  <!-- starts closed: just the magnifying glass; tap it to open -->
  <div class="oa-field">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="oa-search-input" class="oa-input" type="search"
           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="oa-search-results"
           autocomplete="off" spellcheck="false" placeholder="E.g., Hog Island" aria-label="Search oysters by market name">
  </div>
  <p id="oa-search-status" class="oa-status" aria-live="polite"></p>
  <ul id="oa-search-results" class="oa-results" role="listbox" aria-label="Matching oysters"></ul>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var HOME = { center: [-123.05, 49], zoom: 4, bearing: 0, speed: 3, curve: 1 };  /* opening view: Salish Sea; quick flight home */
  var FLY = { speed: 1.8, curve: 1, easing: function (t) { return t; } };  /* default: steady (linear) glide, 1.8x the original site's speed (was 1) */

  /* Each load opens on a random region pill (never the same one twice in a row in this tab);
     the title button still flies back to HOME. Falls back to HOME if the pills are missing. */
  var SKIP_START = ['France'];  /* regions never used as the opening view (their pills still work) */
  var startPills = Array.prototype.filter.call(document.querySelectorAll('.map-places button[data-center]'),
    function (b) { return SKIP_START.indexOf(b.dataset.name) < 0; }), startPill = null, START = HOME;

  /* Areas you can link to by name (oysteratlas.com/#gulf-of-maine): the map fits the area's GeoJSON outline.
     A link like that opens there instead of on a random region. */
  var SHAPES = { 'gulf-of-maine': 'assets/data/regions/GOM_watershed_us-26919-84-50per.json' };
  function shapeKey() { var k = decodeURIComponent(location.hash.slice(1)).toLowerCase(); return SHAPES[k] ? k : null; }
  var linkedShape = shapeKey();

  if (startPills.length && !linkedShape) {
    var last = null;
    try { last = sessionStorage.getItem('oa-start'); } catch (e) {}
    var pool = Array.prototype.filter.call(startPills, function (b) { return b.dataset.name !== last; });
    if (!pool.length) pool = Array.prototype.slice.call(startPills);
    startPill = pool[Math.floor(Math.random() * pool.length)];
    try { sessionStorage.setItem('oa-start', startPill.dataset.name); } catch (e) {}
    START = { center: JSON.parse(startPill.dataset.center), zoom: +startPill.dataset.zoom, bearing: +startPill.dataset.bearing || 0 };
  }

  mapboxgl.accessToken = 'pk.eyJ1IjoiZm9nZmlzaCIsImEiOiJOeXZlMF9FIn0.I3vP7TOUVxyKTaW27p_IqA';
  var map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/fogfish/cifta9e28000ztgkpe46j4rh8',  /* "glow" */
    center: START.center, zoom: START.zoom, bearing: START.bearing || 0,
    customAttribution: '<a href="https://fogday.com/">© Fogday Studios</a> | <a href="https://www.instagram.com/fogfish/">@fogfish</a>'  /* our credit, in Mapbox's credit line */
  });
  /* Bottom-right stack, top to bottom: search, folded map (Regions, phones only), zoom + compass.
     Mapbox stacks bottom-corner controls upward in the order added, so they're added bottom first. */
  map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');  /* zoom + compass */
  /* Phones: the folded-map button, added next so it stacks just above zoom. */
  var regionsCtrl = document.querySelector('.oa-regions');
  map.addControl({
    onAdd: function () { regionsCtrl.classList.add('mapboxgl-ctrl'); regionsCtrl.hidden = false; return regionsCtrl; },
    onRemove: function () { regionsCtrl.remove(); }
  }, 'bottom-right');
  /* Search card, added last so it sits on top, above the folded map (above zoom on desktop, where that button is hidden). */
  var searchCard = document.querySelector('.oa-search');
  map.addControl({
    onAdd: function () { searchCard.classList.add('mapboxgl-ctrl'); searchCard.hidden = false; return searchCard; },
    onRemove: function () { searchCard.remove(); }
  }, 'bottom-right');

  /* iPhone keyboard: it covers the bottom of the screen without resizing the page, which would hide the
     search box and its results. While it's up, raise the bottom-right stack just enough that the search card
     sits right above the keyboard (zoom can go behind it), and shorten the results list if space is tight. */
  var vv = window.visualViewport;
  function liftForKeyboard() {
    var root = document.documentElement, card = document.querySelector('.oa-search'), list = document.getElementById('oa-search-results');
    var kb = 0;
    if (vv && vv.scale < 1.01 && document.activeElement && document.activeElement.id === 'oa-search-input')
      kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    var lift = 0;
    list.style.maxHeight = '';
    if (kb > 0) {
      var css = getComputedStyle(root);
      var current = parseFloat(css.getPropertyValue('--kb')) || 0;
      var gap = window.innerHeight - (card.getBoundingClientRect().bottom + current);  /* card-to-screen-bottom with no lift */
      lift = Math.max(0, kb + 8 - gap);
      var room = (window.innerHeight - kb - 8) - ((parseFloat(css.getPropertyValue('--sat')) || 0) + 8);  /* keyboard top to the safe top */
      var rest = card.getBoundingClientRect().height - list.getBoundingClientRect().height;  /* bar, status line, padding */
      var fiveRows = list.firstElementChild ? 5 * list.firstElementChild.offsetHeight : 220;
      list.style.maxHeight = Math.max(44, Math.min(fiveRows, room - rest)) + 'px';  /* at least 1 row */
    }
    root.style.setProperty('--kb', lift + 'px');
  }
  if (vv) { vv.addEventListener('resize', liftForKeyboard); vv.addEventListener('scroll', liftForKeyboard); }
  document.addEventListener('focusin', liftForKeyboard);
  document.addEventListener('focusout', function () { setTimeout(liftForKeyboard, 50); });

  var calm = window.matchMedia('(prefers-reduced-motion: reduce)');
  var moveTurn = 0;   // counts map moves, so an outline that finishes loading late doesn't undo a newer one
  function go(view) {
    moveTurn++;
    if (calm.matches) map.jumpTo(view);
    else map.flyTo(Object.assign({}, FLY, view));  /* a region's own speed/curve override the default */
  }

  /* Search by market name. Adds its own pin layer on top; the style's heatmap and labels are left alone.
     Point url at the oyster GeoJSON; set nameKey / speciesKey if its properties are named differently. */
  OysterSearch.init({ map: map, url: ['assets/data/oysters.geojson', 'assets/data/oysterater.geojson'], nameKey: 'marketName', speciesKey: 'species',
    fly: function (v) {
      Array.prototype.forEach.call(pills, function (x) { x.removeAttribute('aria-pressed'); });  // a search pick drops the region highlight
      go(v);
    } });

  /* Region pills */
  var row = document.querySelector('.map-places');
  var pills = row.querySelectorAll('button');
  Array.prototype.forEach.call(pills, function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(pills, function (x) { x.removeAttribute('aria-pressed'); });
      b.setAttribute('aria-pressed', 'true');
      reveal(b);
      if (b.dataset.shape) { fitShape(b.dataset.shape, false); return; }   // outline pills fit their area
      go({ center: JSON.parse(b.dataset.center), zoom: +b.dataset.zoom, bearing: +b.dataset.bearing || 0,
           speed: +b.dataset.speed || FLY.speed, curve: +b.dataset.curve || FLY.curve });
    });
  });

  /* Slide the tapped pill fully into view by scrolling only the row sideways.
     (scrollIntoView also scrolls the page on iPhone Safari, which pushed the row up.) */
  function reveal(b, instant) {
    var pad = parseFloat(getComputedStyle(row).scrollPaddingLeft) || 0;
    var left = b.getBoundingClientRect().left - row.getBoundingClientRect().left + row.scrollLeft - pad;
    var right = left + b.offsetWidth + 2 * pad - row.clientWidth;
    var to = row.scrollLeft;
    if (left < to) to = left; else if (right > to) to = right;
    if (to !== row.scrollLeft) row.scrollTo({ left: to, behavior: instant || calm.matches ? 'auto' : 'smooth' });
  }
  /* Highlight the region this load opened on, and slide its pill into view (no animation on load) */
  if (startPill) {
    startPill.setAttribute('aria-pressed', 'true');
    reveal(startPill, true);
  }

  /* Fit an area's outline on screen (its pill or its link), clear of the pill row (top) and the search card
     and legend (bottom). The first fit on load is instant; otherwise it glides there like a pill.
     Any newer move (another pill, the title, a search pick) wins over an outline still loading. */
  var shapeData = {}, shapeBounds = {};
  function loadShape(key) {   // the area's GeoJSON, fetched once
    return shapeData[key] || (shapeData[key] =
      fetch(SHAPES[key]).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }));
  }
  function boundsOf(key) {
    return shapeBounds[key] ? Promise.resolve(shapeBounds[key]) : loadShape(key).then(function (gj) {
      var b = new mapboxgl.LngLatBounds();
      (function walk(c) { if (typeof c[0] === 'number') b.extend([c[0], c[1]]); else c.forEach(walk); })(
        (gj.features || [gj]).map(function (f) { return (f.geometry || f).coordinates; }).filter(Boolean));
      return (shapeBounds[key] = b);
    });
  }

  /* Each area's outline, drawn like the style's Salish Sea ("salishSea-4677 F50" + "fill"): a #f50 line
     fading in by zoom 6 and thickening from 0.5px to 1px, over a faint warm fill that fades out by zoom 8.
     Both sit under the oyster glow so the oysters stay on top. */
  function drawOutlines() {
    Object.keys(SHAPES).forEach(function (key) {
      loadShape(key).then(function (gj) {
        var id = 'oa-outline-' + key;
        if (map.getSource(id)) return;
        var under = map.getLayer('oyster-jsoninput-0.05 100px') ? 'oyster-jsoninput-0.05 100px' : undefined;
        map.addSource(id, { type: 'geojson', data: gj });
        // its faint warm fill too, like "salishSea-4677 fill": half-strength when zoomed out, gone by zoom 8
        map.addLayer({ id: id + '-fill', type: 'fill', source: id, paint: {
          'fill-color': 'rgba(115,96,96,1)',
          'fill-opacity': ['interpolate', ['linear'], ['zoom'], 0, 0.5, 8, 0]
        } }, under);
        map.addLayer({ id: id, type: 'line', source: id, paint: {
          'line-color': '#f50',
          'line-opacity': ['interpolate', ['linear'], ['zoom'], 0, 0, 6, 0.5],
          'line-width': ['interpolate', ['linear'], ['zoom'], 0, 0, 6, 0.5, 9, 0.75, 12, 0.9, 15, 1]
        } }, under);
      }).catch(function () {});
    });
  }
  if (map.isStyleLoaded()) drawOutlines(); else map.once('load', drawOutlines);

  function fitShape(key, instant) {
    var mine = ++moveTurn;
    boundsOf(key).then(function (b) {
      if (mine !== moveTurn) return;   // something newer moved the map while the outline was loading
      Array.prototype.forEach.call(pills, function (x) {
        if (x.dataset.shape === key) { x.setAttribute('aria-pressed', 'true'); reveal(x, instant); }
        else x.removeAttribute('aria-pressed');
      });
      // below whichever navigation is showing: the pill row, or on phones the Regions menu's title (it shuts as we fly)
      var navEl = row.parentNode.offsetParent ? row.parentNode : document.querySelector('.title') || row.parentNode;
      var top = Math.round(navEl.getBoundingClientRect().bottom) + 12;
      var pad = { top: Math.min(top, map.getContainer().clientHeight / 3), bottom: 70, left: 24, right: 24 };
      var still = instant || calm.matches;
      map.fitBounds(b, Object.assign({ padding: pad, maxZoom: 9 }, still ? { duration: 0 } : FLY));
    }).catch(function () {});   // a missing file just leaves the map where it is
  }
  if (linkedShape) fitShape(linkedShape, true);
  window.addEventListener('hashchange', function () { var k = shapeKey(); if (k) fitShape(k, false); });

  /* Title: back to the overview */
  document.querySelector('[data-home]').addEventListener('click', function () {
    Array.prototype.forEach.call(pills, function (x) { x.removeAttribute('aria-pressed'); });
    row.scrollTo({ left: 0, behavior: calm.matches ? 'auto' : 'smooth' });
    go(HOME);
  });

  /* Edge fades: only the side with more regions past it */
  function edges() {
    var more = row.scrollWidth - row.clientWidth;
    row.parentNode.style.setProperty('--fl', row.scrollLeft > 2 ? '28px' : '0px');
    row.parentNode.style.setProperty('--fr', row.scrollLeft < more - 2 ? '28px' : '0px');
  }
  row.addEventListener('scroll', edges, { passive: true });
  window.addEventListener('resize', edges);
  if (window.ResizeObserver) new ResizeObserver(edges).observe(row);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(edges);
  edges();

  /* Mouse wheel scrolls the row sideways */
  row.addEventListener('wheel', function (e) {
    if (row.scrollWidth > row.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      row.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });

  /* Backup for phones: if a sideways finger swipe doesn't scroll the row by itself
     (some iPhone Safari versions), move it with the finger. Does nothing when normal swiping works. */
  var t = null;
  row.addEventListener('scroll', function () { if (t && t.mode !== 'manual') t.native = true; }, { passive: true });
  row.addEventListener('touchstart', function (e) {
    var p = e.touches[0];
    t = { x: p.clientX, y: p.clientY, left: row.scrollLeft, mode: null, native: false };
  }, { passive: true });
  row.addEventListener('touchmove', function (e) {
    if (!t) return;
    var p = e.touches[0], dx = t.x - p.clientX, dy = t.y - p.clientY;
    if (!t.mode) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) t.mode = 'native';   /* up/down: not ours */
      else if (Math.abs(dx) > 30) t.mode = t.native ? 'native' : 'manual';      /* 30px sideways and still no scroll: take over */
    }
    if (t.mode === 'manual') { row.scrollLeft = t.left + dx; if (e.cancelable) e.preventDefault(); }
  }, { passive: false });
  row.addEventListener('touchend', function () { t = null; }, { passive: true });
  row.addEventListener('touchcancel', function () { t = null; }, { passive: true });

  /* Legend: starts collapsed everywhere and opens only when its title is tapped. Nothing else opens it.
     The list slides open/shut in 180ms. <details> can't animate its own height in Safari, so the tap is handled here.
     Tapping again mid-slide reverses from where it is. Reduced-motion users get the instant native toggle. */
  /* The same slide is used by the phone's Regions menu. sliding(menu, open) opens or shuts it from code. */
  function slidingMenu(menu) {
    var sum = menu && menu.querySelector('summary'), list = menu && menu.querySelector('ul');
    if (!sum || !list) return function () {};
    var slide = null, shutting = false;
    function toggle(opening) {
      if (calm.matches || !list.animate) { menu.open = opening; return; }   /* instant */
      var from = menu.open ? list.getBoundingClientRect().height : 0;  /* current height if mid-slide */
      if (slide) slide.cancel();
      menu.open = true;
      var to = opening ? list.scrollHeight : 0;
      shutting = !opening;
      list.style.overflow = 'hidden';
      slide = list.animate({ height: [from + 'px', to + 'px'] },
        { duration: 180, easing: opening ? 'cubic-bezier(.2,.7,.3,1)' : 'cubic-bezier(.4,0,.8,.3)', fill: 'forwards' });
      slide.onfinish = function () {
        if (shutting) menu.open = false;
        slide.cancel(); slide = null; shutting = false;
        list.style.overflow = '';
      };
    }
    sum.addEventListener('click', function (e) {
      if (calm.matches || !list.animate) return;   /* native instant toggle */
      e.preventDefault();
      toggle(!menu.open || shutting);
    });
    return function (open) { if (open !== (menu.open && !shutting)) toggle(open); };
  }
  slidingMenu(document.querySelector('.map-legend'));

  /* Phones: the Regions menu. One row per pill, in the same order; a row taps its pill, so it flies
     exactly the same way, then the menu shuts. The region on screen is bold, kept in step with the pills. */
  var regionMenu = document.querySelector('.map-menu');
  if (regionMenu) {
    var menuList = regionMenu.querySelector('ul'), setMenu = slidingMenu(regionMenu), rows = [];
    Array.prototype.forEach.call(pills, function (b) {
      var li = document.createElement('li'), btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = b.dataset.name || b.textContent.trim();
      btn.addEventListener('click', function () { b.click(); setMenu(false); });
      li.appendChild(btn); menuList.appendChild(li);
      rows.push([b, btn]);
    });
    var syncMenu = function () {
      rows.forEach(function (r) {
        if (r[0].getAttribute('aria-pressed') === 'true') r[1].setAttribute('aria-current', 'true');
        else r[1].removeAttribute('aria-current');
      });
    };
    syncMenu();
    if (window.MutationObserver) new MutationObserver(syncMenu).observe(row, { subtree: true, attributes: true, attributeFilter: ['aria-pressed'] });
  }

  /* Phones: the folded-map button's Regions menu. Tap the button: the menu fades in to its left (250ms, soft ease-out)
     and fades out faster (180ms). A row taps its pill, so it flies exactly the same way, then the menu shuts.
     A tap anywhere else, or Escape, shuts it. The region on screen is bold, kept in step with the pills. */
  var pin = document.querySelector('.oa-pin'), pop = document.getElementById('oa-regions-pop');
  if (pin && pop) {
    var popList = pop.querySelector('ul'), popRows = [], popAnim = null;
    var isOpen = function () { return pin.getAttribute('aria-expanded') === 'true'; };
    var setPop = function (open) {
      if (open === isOpen()) return;
      pin.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (popAnim) { popAnim.cancel(); popAnim = null; }
      pop.hidden = false;
      if (calm.matches || !pop.animate) { pop.hidden = !open; return; }
      var a = pop.animate([{ opacity: 0, transform: 'translateX(6px)' }, { opacity: 1, transform: 'none' }],
        { duration: open ? 250 : 180, easing: open ? 'cubic-bezier(.16,1,.3,1)' : 'cubic-bezier(.4,0,1,1)',
          direction: open ? 'normal' : 'reverse', fill: 'forwards' });
      popAnim = a;
      a.onfinish = function () { popAnim = null; if (!open) pop.hidden = true; a.cancel(); };
    };
    Array.prototype.forEach.call(pills, function (b) {
      var li = document.createElement('li'), btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = b.dataset.name || b.textContent.trim();
      btn.addEventListener('click', function () { b.click(); setPop(false); });
      li.appendChild(btn); popList.appendChild(li);
      popRows.push([b, btn]);
    });
    var syncPop = function () {
      popRows.forEach(function (r) {
        if (r[0].getAttribute('aria-pressed') === 'true') r[1].setAttribute('aria-current', 'true');
        else r[1].removeAttribute('aria-current');
      });
    };
    syncPop();
    if (window.MutationObserver) new MutationObserver(syncPop).observe(row, { subtree: true, attributes: true, attributeFilter: ['aria-pressed'] });
    pin.addEventListener('click', function () { setPop(!isOpen()); });
    document.addEventListener('pointerdown', function (e) { if (isOpen() && !regionsCtrl.contains(e.target)) setPop(false); }, true);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && isOpen()) { setPop(false); pin.focus(); } });
  }
});
</script>
</body>
</html>
